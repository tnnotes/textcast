# Copy to .github/workflows/web-pages.yml in the repository.
# Publishes the web app (web/) on GitHub Pages: https://<user>.github.io/<repo>/
# One-time setup on GitHub: Settings > Pages > Source: "GitHub Actions".
name: Web app on GitHub Pages

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/web-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: python3 web/build.py
      - name: Collect the public files
        run: |
          mkdir -p _site/icons
          cp web/index.html web/sw.js web/manifest.webmanifest _site/
          cp web/icons/*.png _site/icons/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
